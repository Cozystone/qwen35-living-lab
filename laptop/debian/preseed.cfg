# Debian 13 무인 설치 — HP 노트북(DESKTOP-N6RR73M) 실험장. 계획: ../DEBIAN_PLAN.md
# 사용: 빌드 PC 에서 serve_install.sh 실행 -> 노트북 USB 부팅 -> Advanced options -> Automated install
#       -> "http://192.168.0.125:8000/preseed.cfg" 입력.
# 안전장치: 설치 대상은 모델명(16자로 잘림)에 "SSD 850" 이 있고 200~300GB 인 SSD 하나뿐. 못 찾으면 설치를 멈춘다. 1TB HDD 는 건드리지 않는다.

d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8, ko_KR.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Asia/Seoul
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# 네트워크: 유선(RTL8136)이 연결돼 있으면 자동 선택. 무선이면 설치기가 SSID/암호를 직접 묻는다(여기에 암호를 적지 않음).
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string lab-n6rr73m
d-i netcfg/get_domain string local
d-i netcfg/hostname string lab-n6rr73m
d-i hw-detect/load_firmware boolean true

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true

# 계정: root 잠금. 관리자 lab 은 암호 없음(잠금) + 빌드 PC 의 SSH 키로만 접속, sudo 허용.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Lab operator
d-i passwd/username string lab
d-i passwd/user-password-crypted password !
d-i passwd/user-default-groups string sudo

# 디스크: early_command 가 SSD 를 찾아 partman-auto/disk 와 grub 설치 위치를 정한다.
d-i partman/early_command string   SSD=""; for d in $(list-devices disk); do     m=$(cat /sys/block/$(basename $d)/device/model 2>/dev/null);     g=$(( $(cat /sys/block/$(basename $d)/size 2>/dev/null || echo 0) / 2097152 )); case "$m" in *"SSD 850"*) [ $g -ge 200 ] && [ $g -le 300 ] && SSD=$d;; esac; done;   if [ -z "$SSD" ]; then echo "SSD (Samsung SSD 850, 200-300GB) not found - abort" > /dev/tty1; while :; do sleep 3600; done; fi;   debconf-set partman-auto/disk "$SSD";   debconf-set grub-installer/bootdev "$SSD"
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select lab-btrfs
d-i partman-auto/expert_recipe string   lab-btrfs ::     16384 16384 16384 linux-swap       $primary{ } method{ swap } format{ } .     20000 30000 -1 btrfs       $primary{ } $bootable{ } method{ format } format{ }       use_filesystem{ } filesystem{ btrfs } mountpoint{ / } .
d-i partman-partitioning/choose_label string msdos
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo openssh-server nftables btrfs-progs snapper auditd aide rsync curl ca-certificates   python3 git build-essential cmake pkg-config libvulkan-dev glslc vulkan-tools mesa-vulkan-drivers   firmware-iwlwifi firmware-realtek firmware-misc-nonfree pciutils usbutils lm-sensors
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false

# 설치 마지막: 빌드 PC 공개키 등록, sudo 무암호(키 접속 전용 계정), 격리 설정 스크립트 배치(실행은 첫 부팅 후 수동).
d-i preseed/late_command string   in-target install -d -m 700 -o lab -g lab /home/lab/.ssh;   echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBTJdEPetap2FKo1PBSJC/AY3pei//VuNYtEM2pGP5gc anseok-9950x3d->hp-laptop' > /target/home/lab/.ssh/authorized_keys;   in-target chown lab:lab /home/lab/.ssh/authorized_keys;   in-target chmod 600 /home/lab/.ssh/authorized_keys;   echo 'lab ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/lab; chmod 440 /target/etc/sudoers.d/lab;   printf 'PasswordAuthentication no\nKbdInteractiveAuthentication no\nPermitRootLogin no\n' > /target/etc/ssh/sshd_config.d/10-lab.conf;   wget -q -O /target/root/lab-setup.sh http://192.168.0.125:8000/lab-setup.sh; chmod 700 /target/root/lab-setup.sh

d-i finish-install/reboot_in_progress note
